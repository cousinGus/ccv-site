<!-- Cultivating Community Floating Chat Widget (Dynamic Groq API & Monique Persona Edition) -->
<div id="cc-chatbot-wrapper" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  
  <!-- Bouncing Floating Trigger Button -->
  <button id="cc-chat-btn" onclick="toggleCCWidget()" style="background-color: #8AAF5F; color: white; border: none; border-radius: 50px; padding: 12px 18px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; animation: ccBounce 2s infinite; transition: transform 0.2s ease;">
    <span style="font-size: 18px;">💬</span>
    <span style="text-align: left; line-height: 1.2;">
      <strong style="display: block; font-size: 12px;">Cultivating Community Assistant</strong>
      <span style="font-size: 10px; opacity: 0.9;">Got questions? Let's chat.</span>
    </span>
  </button>

  <!-- Hidden Pop-up Chat Window -->
  <div id="cc-chat-popup" style="display: none; width: 320px; height: 420px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #e0e0e0; margin-bottom: 12px; position: absolute; bottom: 65px; right: 0;">
    
    <!-- Chat Header -->
    <div style="background-color: #1a1a1a; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span style="font-weight: 600; font-size: 13px; display: block;">Monique 🌱</span>
        <span style="font-size: 10px; color: #a0a0a0;">Online & keeping it real</span>
      </div>
      <button onclick="toggleCCWidget()" style="background: none; border: none; color: #a0a0a0; font-size: 18px; cursor: pointer; padding: 0;">&times;</button>
    </div>

    <!-- Message Feed -->
    <div id="cc-chat-feed" style="flex: 1; padding: 14px; overflow-y: auto; font-size: 13px; background: #fafafa; display: flex; flex-direction: column; gap: 10px;">
      <div style="background: #eef2eb; color: #2c3e2d; padding: 10px 12px; border-radius: 8px; max-width: 85%; align-self: flex-start; line-height: 1.4;">
        Hi, I'm Monique. How can I help you? 😉
      </div>
    </div>

    <!-- Input Area -->
    <div style="padding: 10px; border-top: 1px solid #eaeaea; background: white; display: flex; gap: 6px;">
      <input type="text" id="cc-user-input" placeholder="Ask away..." style="flex: 1; padding: 8px 10px; border: 1px solid #dcdcdc; border-radius: 6px; font-size: 13px; outline: none;" onkeypress="checkCCEnter(event)">
      <button onclick="sendCCMessage()" style="background-color: #8AAF5F; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;">Send</button>
    </div>
  </div>
</div>

<style>
@keyframes ccBounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
  60% { transform: translateY(-3px); }
}
.typing-indicator {
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background-color: #2c3e2d;
  margin: 0 2px;
  animation: typing 1.4s infinite ease-in-out both;
}
.typing-indicator:nth-child(1) { animation-delay: -0.32s; }
.typing-indicator:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
</style>

<script>
  function toggleCCWidget() {
    const popup = document.getElementById('cc-chat-popup');
    if (popup.style.display === 'flex') {
      popup.style.display = 'none';
    } else {
      popup.style.display = 'flex';
      document.getElementById('cc-user-input').focus();
    }
  }

  function checkCCEnter(e) {
    if (e.key === 'Enter') sendCCMessage();
  }

  async function sendCCMessage() {
    const input = document.getElementById('cc-user-input');
    const feed = document.getElementById('cc-chat-feed');
    const text = input.value.trim();
    if (!text) return;

    // 1. Append User Message
    feed.innerHTML += `<div style="background: #8AAF5F; color: white; padding: 10px 12px; border-radius: 8px; max-width: 85%; align-self: flex-end; line-height: 1.4;">${text}</div>`;
    input.value = '';
    feed.scrollTop = feed.scrollHeight;

    // 2. Add "Typing..." Bubble
    const typingId = 'typing-' + Date.now();
    feed.innerHTML += `
      <div id="${typingId}" style="background: #eef2eb; color: #2c3e2d; padding: 10px 12px; border-radius: 8px; max-width: 85%; align-self: flex-start; display: flex; align-items: center;">
        <span class="typing-indicator"></span><span class="typing-indicator"></span><span class="typing-indicator"></span>
      </div>`;
    feed.scrollTop = feed.scrollHeight;

    let reply = "";

    try {
      // 3. Fetch Dynamic Response from your Python/FastAPI Backend
      const response = await fetch('http://localhost:8000/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      
      if (!response.ok) throw new Error("API Offline");
      const data = await response.json();
      reply = data.reply;
      
    } catch (err) {
      // 4. Bulletproof Fallback if the backend server isn't running yet
      const lower = text.toLowerCase();
      
      if (lower.includes('who are u') || lower.includes('who are you') || lower.includes('your name') || lower.includes('who is monique')) {
        reply = "I'm Monique—just keeping things running smoothly around here. What can I help you find? 😉";
      } else if (lower.includes('how are you') || lower.includes('doing')) {
        reply = "I'm doing great! Just keeping the energy high. What can I help you with today? 😉";
      } else if (lower.includes('what is') || lower.includes('about') || lower.includes('non-profit') || lower.includes('mission') || lower.includes('want is')) {
        reply = "Cultivating Community is a 501(c)(3) nonprofit focused on sustainable local food systems, rescue networks, and community support right here across Washington, D.C.";
      } else if (lower.includes('who') && (lower.includes('run') || lower.includes('founder') || lower.includes('lead') || lower.includes('andrew'))) {
        reply = "Cultivating Community is spearheaded by Andrew, focusing on sustainable local food systems, rescue networks, and community support across Washington, D.C.";
      } else if (lower.includes('donate') || lower.includes('give') || lower.includes('money') || lower.includes('fund')) {
        reply = "Looking to support the mission? Head over to our donate page! Recurring gifts keep us fiercely independent and running strong.";
      } else if (lower.includes('volunteer') || lower.includes('help') || lower.includes('timecounts') || lower.includes('want to')) {
        reply = "Want to get your hands dirty? Head over to our volunteer page and sign up via Timecounts. We've got spots open across logistics, distribution, IT, and events!";
      } else if (lower.includes('grocery') || lower.includes('food') || lower.includes('sunday') || lower.includes('distribution') || lower.includes('pick up') || lower.includes('where')) {
        reply = "We host our free grocery distributions every Sunday from 12 PM to 2 PM at 3417 14th St. NW. Come through, all are welcome!";
      } else if (lower === 'hi' || lower === 'hello' || lower === 'hey') {
        reply = "Hi, I'm Monique. How can I help you? 😉";
      } else {
        reply = "Look, I like your style, but let's keep it to the mission! Ask me about our Sunday groceries, volunteering, Andrew, or our programs. 😉";
      }
    }

    // 5. Remove Typing Bubble & Display the Final Answer
    const typingElement = document.getElementById(typingId);
    if (typingElement) typingElement.remove();
    
    feed.innerHTML += `<div style="background: #eef2eb; color: #2c3e2d; padding: 10px 12px; border-radius: 8px; max-width: 85%; align-self: flex-start; line-height: 1.4;">${reply}</div>`;
    feed.scrollTop = feed.scrollHeight;
  }
</script>
